# 每月更新紅綠燈時制（臺北 145720、澎湖 113153）與國道速限（40476）
# 等價本機指令：python -I scripts/dryrun.py monthly
name: 每月時制資料
on:
  schedule:
    - cron: '0 20 1 * *'   # UTC 每月 1 日 20:00＝台灣時間 2 日 04:00
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: touror-data-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 單元測試
        run: python -u -I -m unittest discover -s scripts/tests -t scripts
        env:
          PYTHONUNBUFFERED: "1"
      - name: 下載時制與國道速限（資料集 API；請求間隔 40 秒以上）
        run: python -u -I scripts/fetch.py timing speedlimits
        env:
          PYTHONUNBUFFERED: "1"
      - name: 建置、驗證、決定版本
        id: publish
        run: |
          set +e
          python -u -I scripts/publish.py timing speedlimits --max-drop 0.05
          echo "code=$?" >> "$GITHUB_OUTPUT"
          python -u -I scripts/report.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: 失敗 → 開 issue（不發布）
        if: steps.publish.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let detail = '（沒有報告）';
            try { detail = JSON.parse(fs.readFileSync('build/publish-report.json', 'utf8')).error || detail; } catch (e) {}
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '每月時制資料未發布（結束碼 ${{ steps.publish.outputs.code }}）',
              body: '執行：' + run + '\n\n原因：\n\n' + detail,
            });
      - name: 未發布就停止
        if: steps.publish.outputs.code != '0'
        run: exit 1
      - name: 有變更才 commit
        id: commit
        run: |
          if git diff --quiet -- data manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "內容沒有變更"; exit 0
          fi
          git config user.name "touror-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data manifest.json CHANGELOG.md raw/speedcams/freeway_limits_40476.csv
          git commit -m "時制與國道速限更新 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
