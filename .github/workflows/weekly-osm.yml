# 每週重建紅綠燈位置與休息點（OSM 台灣 extract）＋政府號誌位置補點（臺北 121890、彰化 37695、澎湖 113153、臺南 79978、臺中 103743）
# 等價本機指令：python -I scripts/dryrun.py weekly --pbf <taiwan-latest.osm.pbf>
# 每週下載一次完整 extract（約 330 MB）比每日 diff 簡單可靠；資料只用節點與少量 way，每週更新已足夠。
name: 每週 OSM 資料
on:
  schedule:
    - cron: '0 18 * * 0'   # UTC 週日 18:00＝台灣時間週一 02:00
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: touror-data-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝 pyosmium、numpy（紅綠燈吸附 snap_signals.py 需要）
        run: python -m pip install --disable-pip-version-check osmium==4.3.2 numpy==2.2.6
      - name: 單元測試
        run: python -u -I -m unittest discover -s scripts/tests -t scripts
        env:
          PYTHONUNBUFFERED: "1"
      - name: 下載 Geofabrik 台灣 extract（核對 MD5）
        run: |
          mkdir -p raw/osm && cd raw/osm
          curl -fsSL --retry 5 --retry-delay 60 --retry-all-errors -A "touror-data-builder" -o taiwan-latest.osm.pbf https://download.geofabrik.de/asia/taiwan/taiwan-latest.osm.pbf
          sleep 40
          curl -fsSL --retry 5 --retry-delay 60 --retry-all-errors -A "touror-data-builder" -o taiwan-latest.osm.pbf.md5 https://download.geofabrik.de/asia/taiwan/taiwan-latest.osm.pbf.md5
          md5sum -c taiwan-latest.osm.pbf.md5
      # raw/signals 不進版控，也不在 Pages／release 資產裡：用 cache 保存上一次成功下載的原始檔，
      # 單一來源下載失敗時 fetch.py 沿用這份舊檔（status＝kept）；連舊檔都沒有才略過該來源（過半失敗仍停止）
      - name: 還原上一次的政府號誌原始檔（舊檔備援）
        uses: actions/cache/restore@v4
        with:
          path: raw/signals/*_signals_*.csv
          key: gov-signals-raw-${{ github.run_id }}
          restore-keys: gov-signals-raw-
      - name: 下載政府號誌位置（資料集 API；請求間隔 40 秒以上）
        run: python -u -I scripts/fetch.py signals
        env:
          PYTHONUNBUFFERED: "1"
      - name: 保存本次政府號誌原始檔（下次的舊檔備援）
        uses: actions/cache/save@v4
        with:
          path: raw/signals/*_signals_*.csv
          key: gov-signals-raw-${{ github.run_id }}
      - name: 下載各縣市與移動式測速原始檔（每週一次）
        run: python -u -I scripts/fetch.py speedcams-counties
        timeout-minutes: 60
        # 縣市資料變動少、境外連線常被擋：失敗只留紀錄，不能擋住後面的紅綠燈／休息點發布
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
      # 號誌信心旁檔的「疑似未收錄號誌路口」需要路口庫（本機在 重機導航\資料\搜尋，不在 repo）：
      # 從 offline-manifest.json 登記的 Release 資產下載並核對 sha256；失敗不擋發布，signal_quality 會略過疑似點並印 ::warning
      - name: 下載路口庫（offline-manifest 的 Release 資產，核對 sha256）
        continue-on-error: true
        run: |
          mkdir -p raw/junctions
          read -r URL SHA < <(python -I -c "import json; e=[x for x in json.load(open('offline-manifest.json', encoding='utf-8'))['files'] if x.get('kind')=='junctions'][0]; print(e['url'], e['sha256'])")
          curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors -A "touror-data-builder" -o raw/junctions/touror_junctions.sqlite "$URL"
          echo "$SHA  raw/junctions/touror_junctions.sqlite" | sha256sum -c - || { rm -f raw/junctions/touror_junctions.sqlite; echo "::warning::路口庫 sha256 不符，已刪除"; exit 1; }
      - name: 建置、併政府補點、驗證、決定版本
        id: publish
        run: |
          set +e
          python -u -I scripts/publish.py signals reststops --pbf raw/osm/taiwan-latest.osm.pbf --max-drop 0.05
          echo "code=$?" >> "$GITHUB_OUTPUT"
          python -u -I scripts/report.py
        env:
          PYTHONUNBUFFERED: "1"
          TOUROR_JUNCTIONS: ${{ github.workspace }}/raw/junctions/touror_junctions.sqlite
      - name: 失敗 → 開 issue（不發布）
        if: steps.publish.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let detail = '（沒有報告）';
            try { detail = JSON.parse(fs.readFileSync('build/publish-report.json', 'utf8')).error || detail; } catch (e) {}
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '每週 OSM 資料未發布（結束碼 ${{ steps.publish.outputs.code }}）',
              body: '執行：' + run + '\n\n原因：\n\n' + detail,
            });
      - name: 未發布就停止
        if: steps.publish.outputs.code != '0'
        run: exit 1
      - name: 有變更才 commit
        id: commit
        run: |
          if git diff --quiet -- data manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "內容沒有變更"; exit 0
          fi
          git config user.name "touror-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data manifest.json CHANGELOG.md raw/speedcams
          git commit -m "OSM 紅綠燈與休息點更新 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        # 資料有變更才部署；手動觸發（workflow_dispatch）一律部署，才能在資料沒變時發布新增的檔案（例如 offline-manifest.json）
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
